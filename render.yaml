# Render Blueprint — web service only (database is external: Neon/Supabase).
# The Postgres connection string is provided via the DATABASE_URL env var.
# See DEPLOYMENT.md for full instructions.
services:
  - type: web
    name: emis-records-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false            # set manually in the Render dashboard (Neon URL)
      - key: MASTER_KEY
        generateValue: true    # Render generates & stores a random secret
      - key: PYTHON_VERSION
        value: 3.13.0
